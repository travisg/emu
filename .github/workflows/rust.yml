name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # the kaypro frontend links the system SDL2
    - name: Install SDL2
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

    - name: Build
      run: cargo build --verbose

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    # the whole suite runs here: it needs no ROM images and no external
    # binaries. The end-to-end scripts in test/ do need ROMs, so they don't run
    # in CI at all -- see the Test section of AGENTS.md
    - name: Test
      run: cargo test --verbose
