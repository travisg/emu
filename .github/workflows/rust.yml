name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # the kaypro frontend links the system SDL2
    - name: Install SDL2
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

    - name: Build
      run: cargo build --verbose

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    # the whole suite runs here: it needs no ROM images and no external
    # binaries -- see the Test section of AGENTS.md
    - name: Test
      run: cargo test --verbose

    # The 703 guests are built from source in this tree with stdlib python, and
    # the harnesses need only script(1), so these run without any third-party
    # ROM image. The 6809 BASIC test does need one and stays local.
    - name: Build the 703 guest images
      run: make -C test ray703

    - name: 703 end-to-end tests
      run: make -C test ray703-test ray703-basic-test ray703-disc-test ray703-boot-test

    # Re-assembles a 1968 listing transcript and diffs it against the object
    # code printed beside it. Pure python; the X-RAY half is a known fail and
    # the makefile ignores it.
    - name: Verify the transcribed listings
      run: make -C test ray703-verify
